include:
  - jobs/*.yaml

targets:
  # The 'dev' target, for development purposes. This target is the default.
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405610492478200.0.azuredatabricks.net

  # The 'prod' target, used for production deployment.
  prod:
    mode: production
    workspace:
      host: https://adb-7405610492478200.0.azuredatabricks.net
      # We always use /Users/akshay.doyizode.de@gmail.com for all resources to make sure we only have a single copy.
      root_path: /Users/akshay.doyizode.de@gmail.com/.bundle/${bundle.name}/${bundle.target}
    run_as:
      # This runs as akshay.doyizode.de@gmail.com in production. We could also use a service principal here,
      # see https://docs.databricks.com/dev-tools/bundles/permissions.html.
      user_name: akshay.doyizode.de@gmail.com
